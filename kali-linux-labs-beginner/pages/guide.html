<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/img/logo-learning-fly-simple.png">
    <title>Guia de Campo - Kali Linux</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['Fira Code', 'monospace'],
                    },
                    colors: {
                        'kali-bg': '#0d1117',
                        'kali-card': '#161b22',
                        'kali-border': '#30363d',
                        'kali-blue': '#58a6ff',
                        'kali-green': '#39d353',
                        'kali-text': '#c9d1d9',
                        'terminal-black': '#0c0c0c',
                        'dark-bg': '#0d1117',
                        'dark-card': '#161b22',
                        'dark-border': '#30363d',
                        'dark-text': '#c9d1d9',
                        'dark-text-secondary': '#8b949e',
                        'accent-green': '#39d353', // compatibility
                    }
                }
            }
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #30363d;
        }

        /* Markdown Styles */
        .markdown-body h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0 0 1.5rem;
            padding-bottom: 0.5rem;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
        }

        .markdown-body h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            color: #111827;
        }

        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 1.5rem 0 0.75rem;
            color: #111827;
        }

        .markdown-body p {
            margin-bottom: 1rem;
            line-height: 1.7;
            color: #374151;
        }

        .markdown-body ul {
            list-style: disc inside;
            margin-bottom: 1rem;
            color: #374151;
        }

        .markdown-body pre {
            margin-bottom: 1.5rem;
            padding: 1rem;
            overflow-x: auto;
            color: #f3f4f6;
            background: #111827;
            border: 1px solid #30363d;
            border-radius: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
        }

        .markdown-body code {
            padding: 0.125rem 0.25rem;
            color: #db2777;
            background: #f3f4f6;
            border-radius: 0.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
        }

        .markdown-body pre code {
            padding: 0;
            color: #f3f4f6;
            background: transparent;
        }

        .markdown-body blockquote {
            margin: 1rem 0;
            padding: 0.25rem 1rem;
            color: #374151;
            background: #eff6ff;
            border-left: 4px solid #58a6ff;
            border-radius: 0 0.25rem 0.25rem 0;
            font-style: italic;
        }

        .markdown-body img {
            max-width: 100%;
            margin: 1.5rem 0;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2);
        }

        .active-guide {
            color: #39d353 !important;
            background: rgba(30, 58, 138, 0.2) !important;
            border-left-color: #39d353 !important;
        }

        .dark .markdown-body h1 {
            color: #ffffff;
            border-bottom-color: #30363d;
        }

        .dark .markdown-body h2,
        .dark .markdown-body h3 {
            color: #ffffff;
        }

        .dark .markdown-body p,
        .dark .markdown-body ul,
        .dark .markdown-body blockquote {
            color: #d1d5db;
        }

        .dark .markdown-body code {
            color: #f9a8d4;
            background: #1f2937;
        }

        .dark .markdown-body blockquote {
            background: rgba(30, 58, 138, 0.2);
        }

        body {
            font-family: 'Fira Code', monospace;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 50;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(57, 211, 83, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% {
                bottom: 100%;
            }

            100% {
                bottom: -100px;
            }
        }
    </style>
</head>

<body
    class="bg-gray-100 dark:bg-kali-bg text-gray-800 dark:text-kali-text transition-colors duration-300 min-h-screen flex flex-col overflow-x-hidden">
    <div
        class="fixed inset-0 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-20 z-0">
    </div>
    <div class="scanline"></div>

    <!-- Navigation -->
    <nav class="border-b border-kali-border bg-kali-bg/90 backdrop-blur-md sticky top-0 z-50 flex-shrink-0">
        <div class="container mx-auto px-6 h-20 flex justify-between items-center overflow-x-auto">
            <div class="flex items-center gap-4 flex-shrink-0">
                <a href="../index.html">
                    <img src="../assets/img/logo-learning-fly-simple.png" alt="Logo" class="h-10 w-10">
                </a>
                <span class="text-xl font-bold tracking-tighter text-white hidden xl:block">
                    <span class="text-kali-green">root</span>@<span class="text-kali-blue">kali-lab</span>:<span
                        class="text-gray-500">/pages</span>$
                </span>
            </div>

            <div class="flex items-center gap-6 text-sm font-bold flex-shrink-0 whitespace-nowrap ml-4">
                <a href="../index.html" class="text-gray-500 hover:text-kali-green transition-colors hidden lg:block">cd
                    /home</a>
                <a href="install.html" class="text-gray-500 hover:text-kali-blue transition-colors">./Instalação</a>
                <a href="labs.html" class="text-gray-500 hover:text-kali-blue transition-colors">./Laboratórios</a>
                <a href="video.html" class="text-gray-500 hover:text-kali-blue transition-colors">./Vídeos</a>
                <a href="wiki.html" class="text-gray-500 hover:text-kali-blue transition-colors">./Wiki</a>
                <a href="guide.html" class="text-kali-green hover:text-white transition-colors">./Guia</a>

                <button onclick="toggleTheme()" class="text-gray-500 hover:text-yellow-400 transition-colors"
                    title="Alternar Tema">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="flex flex-col lg:flex-row flex-grow min-h-0 lg:h-[calc(100vh-5rem)] overflow-y-auto lg:overflow-hidden relative z-10 max-w-[1600px] mx-auto w-full">

        <!-- Sidebar Navigation -->
        <aside
            class="w-full lg:w-64 bg-white dark:bg-kali-card border-b lg:border-b-0 border-r-0 lg:border-r border-gray-200 dark:border-kali-border flex flex-col flex-shrink-0 max-h-56 lg:max-h-none lg:h-full overflow-hidden transition-colors">
            <div class="p-4 border-b border-gray-200 dark:border-kali-border">
                <h2 class="font-bold text-gray-900 dark:text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-kali-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg>
                    Capítulos
                </h2>
            </div>
            <div id="guides-list" class="flex lg:flex-col flex-grow overflow-x-auto lg:overflow-x-hidden lg:overflow-y-auto custom-scrollbar p-2 gap-2 lg:gap-1">
                <!-- Injected via JS -->
            </div>
        </aside>

        <!-- Main Content -->
        <main
            class="flex-grow flex flex-col min-h-[65vh] lg:h-full overflow-hidden bg-gray-50 dark:bg-kali-bg p-3 md:p-8 transition-colors">
            <div
                class="max-w-5xl w-full mx-auto h-full flex flex-col bg-white dark:bg-kali-card rounded-2xl shadow-xl overflow-hidden border border-gray-200 dark:border-kali-border">

                <!-- Toolbar -->
                <div
                    class="min-h-14 bg-gray-50 dark:bg-kali-card/50 border-b border-gray-200 dark:border-kali-border flex items-center justify-between gap-3 px-4 md:px-6 py-2 flex-shrink-0">
                    <span id="current-guide-title"
                        class="font-bold text-gray-700 dark:text-kali-green text-sm md:text-base font-mono truncate">Carregando...</span>

                    <div class="flex items-center gap-2 flex-shrink-0">
                        <button id="prev-guide" class="text-xs px-2 py-1.5 rounded border border-gray-300 dark:border-kali-border text-gray-500 hover:text-kali-green disabled:opacity-40" title="Capítulo anterior" disabled>
                            &larr;
                        </button>
                        <span id="guide-progress" class="hidden sm:inline text-[10px] text-gray-500 dark:text-gray-400 font-mono"></span>
                        <button id="next-guide" class="text-xs px-2 py-1.5 rounded border border-gray-300 dark:border-kali-border text-gray-500 hover:text-kali-green disabled:opacity-40" title="Próximo capítulo" disabled>
                            &rarr;
                        </button>
                        <a id="video-link" href="#"
                            class="hidden text-xs bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-3 py-1.5 rounded-full font-bold hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Ver Vídeo
                        </a>
                    </div>
                </div>

                <!-- Markdown Reader -->
                <div id="reader-content" class="flex-grow overflow-y-auto custom-scrollbar p-8 markdown-body">
                    <div class="flex items-center justify-center h-full text-gray-500">Selecione um guia na lateral
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { guides } from '../assets/js/guides.js';
        import { videos } from '../assets/js/videos.js';

        document.documentElement.classList.add(localStorage.getItem('theme') || 'dark');

        const guidesList = document.getElementById('guides-list');
        const readerContent = document.getElementById('reader-content');
        const currentGuideTitle = document.getElementById('current-guide-title');
        const videoLink = document.getElementById('video-link');
        const prevGuideBtn = document.getElementById('prev-guide');
        const nextGuideBtn = document.getElementById('next-guide');
        const guideProgress = document.getElementById('guide-progress');
        const guideProgressKey = 'learningfly-kali-read-guides';
        let activeGuideIndex = 0;

        function loadGuide(guide) {
            activeGuideIndex = guides.findIndex(item => item.id === guide.id);
            currentGuideTitle.innerText = guide.title;
            readerContent.innerHTML = '<div class="flex items-center justify-center h-full"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-kali-green"></div></div>';
            history.replaceState({}, '', `?guide=${guide.id}`);
            guideProgress.innerText = `${activeGuideIndex + 1} / ${guides.length}`;
            prevGuideBtn.disabled = activeGuideIndex <= 0;
            nextGuideBtn.disabled = activeGuideIndex >= guides.length - 1;

            const completed = new Set(JSON.parse(localStorage.getItem(guideProgressKey) || '[]'));
            completed.add(guide.id);
            localStorage.setItem(guideProgressKey, JSON.stringify([...completed]));

            const linkedVideo = videos.find(v => v.guideId === guide.id);
            if (linkedVideo) {
                videoLink.href = `video.html?v=${linkedVideo.id}`;
                videoLink.classList.remove('hidden');
                videoLink.classList.add('flex');
            } else {
                videoLink.classList.add('hidden');
            }

            document.querySelectorAll('.guide-item').forEach(el => {
                el.classList.remove('active-guide');
                if (el.dataset.id === guide.id) el.classList.add('active-guide');
            });

            fetch(`../guide/${guide.file}`)
                .then(res => {
                    if (!res.ok) throw new Error("File not found");
                    return res.text();
                })
                .then(text => {
                    readerContent.innerHTML = marked.parse(text);
                    enhanceCodeBlocks();
                    readerContent.scrollTop = 0;
                })
                .catch(err => {
                    readerContent.innerHTML = `<div class="text-red-500 text-center p-4">Erro ao carregar o conteúdo: ${err.message}</div>`;
                });
        }

        function renderSidebar() {
            guides.forEach(guide => {
                const btn = document.createElement('button');
                btn.className = 'guide-item flex-none lg:flex-initial min-w-max lg:min-w-0 w-auto lg:w-full text-left px-4 py-3 rounded-lg text-sm text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-bg transition-colors font-medium border-l-4 border-transparent whitespace-nowrap lg:whitespace-normal';
                btn.innerText = guide.title;
                btn.dataset.id = guide.id;
                btn.onclick = () => loadGuide(guide);
                guidesList.appendChild(btn);
            });
        }

        renderSidebar();

        prevGuideBtn.addEventListener('click', () => {
            if (activeGuideIndex > 0) loadGuide(guides[activeGuideIndex - 1]);
        });

        nextGuideBtn.addEventListener('click', () => {
            if (activeGuideIndex < guides.length - 1) loadGuide(guides[activeGuideIndex + 1]);
        });

        function enhanceCodeBlocks() {
            readerContent.querySelectorAll('pre').forEach(pre => {
                const code = pre.querySelector('code');
                if (!code || pre.querySelector('.guide-code-actions')) return;
                const fullCommand = code.innerText.trim();
                const executableLine = fullCommand.split('\n')
                    .map(line => line.trim())
                    .find(line => line && !line.startsWith('#') && !line.toLowerCase().startsWith('bash'));
                if (!fullCommand) return;

                const actions = document.createElement('div');
                actions.className = 'guide-code-actions flex justify-end gap-2 mb-2';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'text-[10px] px-2 py-1 rounded border border-gray-600 text-gray-300 hover:text-white hover:border-kali-green';
                copyBtn.innerText = 'COPIAR';
                copyBtn.onclick = () => navigator.clipboard.writeText(fullCommand);
                actions.appendChild(copyBtn);

                if (executableLine) {
                    const sandboxBtn = document.createElement('button');
                    sandboxBtn.className = 'text-[10px] px-2 py-1 rounded bg-kali-green text-kali-bg font-bold hover:bg-green-300';
                    sandboxBtn.innerText = 'EXECUTAR NO SANDBOX';
                    sandboxBtn.onclick = () => {
                        const command = executableLine.replace(/^sudo\s+/, '').replace(/\\-/g, '-');
                        sessionStorage.setItem('learningfly-kali-pending-command', JSON.stringify({ command, source: 'guide', timestamp: Date.now() }));
                        window.location.href = 'terminal.html?tool=playground&source=guide';
                    };
                    actions.appendChild(sandboxBtn);
                }

                pre.parentNode.insertBefore(actions, pre);
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const guideId = urlParams.get('guide');
        if (guideId) {
            const g = guides.find(x => x.id === guideId);
            if (g) loadGuide(g);
            else if (guides.length) loadGuide(guides[0]);
        } else if (guides.length > 0) {
            loadGuide(guides[0]);
        }
    </script>
</body>

</html>
